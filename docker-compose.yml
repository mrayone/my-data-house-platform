# Ambiente local da PoC (ADR-0008 — topologia single-node, paridade explícita
# com ClickHouse Cloud no GCP). Suba com `make up`, nunca `docker compose up`
# direto: o Makefile espera os healthchecks antes de devolver o prompt.
#
# Versões fixadas (ver docs/evaluation/clickhouse-cloud-gcp-criteria.md):
#   ClickHouse       26.8.3.105 (LTS)
#   Confluent Platform 8.3.1 (Kafka em KRaft — sem ZooKeeper)
#   clickhouse-kafka-connect v1.5.0 (deploy/connect/Dockerfile)
#
# TODO(humano, ao rodar pela primeira vez com rede irrestrita): fixar também o
# digest de cada imagem (`docker inspect --format='{{index .RepoDigests 0}}' <img>`)
# e colar aqui, conforme ADR-0008 §6. Esta sessão de execução não teve acesso a
# um registry de imagens Docker para calcular os digests de antemão.

name: my-data-house-platform

x-clickhouse-image: &clickhouse-image clickhouse/clickhouse-server:26.8.3.105

services:
  clickhouse:
    image: *clickhouse-image
    container_name: dh-clickhouse
    hostname: clickhouse
    ports:
      - "8123:8123" # HTTP
      - "9000:9000" # nativo (clickhouse-client)
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-default}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-changeme}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - ./deploy/clickhouse/config:/etc/clickhouse-server/config.d:ro
      - ./deploy/clickhouse/users:/etc/clickhouse-server/users.d
      - clickhouse-data:/var/lib/clickhouse
    depends_on:
      clickhouse-keeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  clickhouse-keeper:
    image: *clickhouse-image
    container_name: dh-clickhouse-keeper
    hostname: clickhouse-keeper
    entrypoint: ["clickhouse-keeper"]
    command: ["--config-file=/etc/clickhouse-keeper/keeper_config.xml"]
    ports:
      - "9181:9181"
    volumes:
      - ./deploy/keeper/keeper_config.xml:/etc/clickhouse-keeper/keeper_config.xml:ro
      - keeper-data:/var/lib/clickhouse-keeper
    healthcheck:
      # `ruok` é o comando de saúde do protocolo Zookeeper/Keeper — responde "imok".
      # Usa nc (netcat) pois a imagem usa sh (Dash), que não suporta /dev/tcp.
      test: ["CMD-SHELL", "echo ruok | nc -w 1 127.0.0.1 9181 | grep -q imok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  kafka:
    image: confluentinc/cp-kafka:8.3.1
    container_name: dh-kafka
    hostname: kafka
    ports:
      - "9092:9092" # listener externo, para producer/dhctl rodando na máquina
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: "dh-poc-kraft-cluster-1"
      # Requisito de extensibilidade (ADR-0003 / deploy/CLAUDE.md #6): tópico
      # nasce de dhctl topics apply, com as partições do contrato. Auto-create
      # esconderia contrato faltante.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  schema-registry:
    image: confluentinc/cp-schema-registry:8.3.1
    container_name: dh-schema-registry
    hostname: schema-registry
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC: _schemas
      # ADR-0006 §4 — evolução compatível para trás é o contrato assumido pelo
      # gerador de Avro (dhctl generate).
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: backward
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      # cp-schema-registry (RHEL UBI minimal) não tem curl/wget — usa python3 urllib.
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8081/subjects')\" 2>/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  kafka-connect:
    build:
      context: ./deploy/connect
      dockerfile: Dockerfile
    image: my-data-house-platform/kafka-connect:1.5.0
    container_name: dh-kafka-connect
    hostname: kafka-connect
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:29092
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: dh-connect-cluster
      CONNECT_CONFIG_STORAGE_TOPIC: dh-connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: dh-connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: dh-connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_KEY_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONNECT_VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components,/opt/dh-plugins
      CONNECT_LOG4J_ROOT_LOGLEVEL: INFO
      # DLQ obrigatória (deploy/CLAUDE.md #5) — mensagem malformada nunca é
      # descartada em silêncio. Nome final do tópico é por-connector, definido
      # na config gerada (dhctl generate); isto é só o valor default.
      CONNECT_ERRORS_TOLERANCE: all
      CONNECT_ERRORS_DEADLETTERQUEUE_TOPIC_NAME: dh-dlq-default
      CONNECT_ERRORS_DEADLETTERQUEUE_TOPIC_REPLICATION_FACTOR: 1
      CONNECT_ERRORS_DEADLETTERQUEUE_CONTEXT_HEADERS_ENABLE: "true"
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      # cp-kafka-connect (RHEL UBI minimal) não tem curl/wget — usa python3 urllib.
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8083/connectors')\" 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  clickhouse-data:
  keeper-data:
  kafka-data:
